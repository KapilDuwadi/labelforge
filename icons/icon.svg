<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#1e293b"/>
  <!-- label card -->
  <rect x="88" y="100" width="336" height="280" rx="20" fill="#334155"/>
  <!-- dotted border -->
  <rect x="88" y="100" width="336" height="280" rx="20" fill="none"
        stroke="#94a3b8" stroke-width="8" stroke-dasharray="18 9"/>
  <!-- product name bar -->
  <rect x="116" y="132" width="190" height="22" rx="6" fill="white"/>
  <!-- divider -->
  <rect x="88" y="174" width="336" height="3" fill="#475569"/>
  <!-- ingredient lines -->
  <rect x="116" y="192" width="100" height="11" rx="4" fill="#94a3b8"/>
  <rect x="116" y="212" width="270" height="10" rx="4" fill="#64748b"/>
  <rect x="116" y="230" width="240" height="10" rx="4" fill="#64748b"/>
  <rect x="116" y="248" width="220" height="10" rx="4" fill="#64748b"/>
  <!-- bottom strip divider -->
  <rect x="88" y="302" width="336" height="3" fill="#475569"/>
  <!-- bottom chips -->
  <rect x="116" y="316" width="120" height="40" rx="8" fill="#3b82f6" opacity="0.85"/>
  <rect x="252" y="316" width="148" height="40" rx="8" fill="#3b82f6" opacity="0.85"/>
  <!-- app name below -->
  <text x="256" y="452" font-family="Arial, Helvetica, sans-serif"
        font-size="56" font-weight="700" fill="white" text-anchor="middle"
        letter-spacing="-1">LabelForge</text>
</svg>
